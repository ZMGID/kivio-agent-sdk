name: Agent SDK

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/consumer -> target
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check SDK boundaries
        run: |
          python scripts/check-agent-sdk.test.py
          python scripts/check-agent-sdk.py

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/consumer/Cargo.toml --all -- --check

      - name: Test SDK
        run: |
          cargo test --locked
          cargo test --locked --all-features

      - name: Check examples
        run: cargo check --locked --examples --all-features

      - name: Run offline examples
        run: |
          cargo run --locked --example agent -- minimal
          cargo run --locked --example agent -- cancel
          cargo run --locked --example agent -- inputs
          cargo run --locked --example agent -- continue
          cargo run --locked --example session_offline --all-features

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Test independent consumer
        run: cargo test --locked --manifest-path tests/consumer/Cargo.toml

      - name: Verify distributable package
        run: |
          cargo package --locked
          python scripts/check-agent-sdk.py --package target/package/kivio-agent-sdk-*.crate --test-consumer
